services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${ARBITER_DB_USER:-arbiter}
      POSTGRES_PASSWORD: ${ARBITER_DB_PASSWORD:-arbiter}
      POSTGRES_DB: ${ARBITER_DB_NAME:-arbiter}
    ports:
      - "127.0.0.1:${ARBITER_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
